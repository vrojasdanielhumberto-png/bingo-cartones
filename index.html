<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2233">
<title>Mis cartones de Bingo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1c2233;color:#fff;font-family:system-ui,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.bar{display:flex;gap:6px;padding:10px 12px 4px}
.bar input{flex:1;font-size:22px;padding:8px 10px;border-radius:10px;border:0;min-width:0}
.bar button{font-size:15px;padding:8px 12px;border-radius:10px;border:0;font-weight:700;color:#fff}
#ok{background:#4caf50}#reset{background:#e57373}
#msg{text-align:center;height:22px;font-weight:700;color:#ffd54f;font-size:15px}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 10px}
.card{background:#232b40;border-radius:16px;padding:10px;width:min(100%,calc((100dvh - 210px) * .86));}
.card h2{font-size:16px;margin:0 0 6px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.h{text-align:center;font-weight:900;font-size:clamp(18px,6vw,28px)}
.c{aspect-ratio:1;border-radius:50%;background:#fff;color:#222;font-size:clamp(18px,6.5vw,30px);font-weight:800;display:flex;align-items:center;justify-content:center;border:4px solid;user-select:none;cursor:pointer;transition:transform .1s}
.c.on{background:#ffd54f;transform:scale(.9);box-shadow:inset 0 0 0 3px #e65100}
.c.free{background:#ffd54f}
.win{color:#4caf50}
nav{display:flex;background:#121726;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:#aab;padding:10px 0 12px;font-size:14px;font-weight:700;border-top:3px solid transparent}
nav button b{display:block;font-size:12px;font-weight:400;opacity:.8}
nav button.act{color:#ffd54f;border-top-color:#ffd54f}
</style></head><body><div class="app">
<div class="bar"><input id="n" type="number" inputmode="numeric" placeholder="Número cantado"><button id="ok">Marcar</button><button id="reset">Borrar</button></div>
<div id="msg"></div>
<main id="card"></main>
<nav id="tabs"></nav>
</div>
<script>
const cards={6489:[[11,5,4,6,14],[22,27,21,23,18],[43,38,0,32,45],[49,52,47,54,53],[62,69,63,68,70]],
6490:[[15,10,5,7,9],[20,22,17,28,27],[32,42,0,33,34],[46,51,56,53,60],[65,66,64,74,67]],
6495:[[5,4,2,10,3],[23,26,29,22,27],[37,42,0,43,44],[47,55,52,58,59],[64,67,70,65,69]]};
const col=['#f5c518','#4a7fd4','#3fae8a','#e8604c','#a98bd6'];
let marked=new Set(),cur='6489';
try{marked=new Set(JSON.parse(localStorage.bingo||'[]'));cur=localStorage.bingoTab||cur}catch(e){}
if(!cards[cur])cur='6489';
const save=()=>{try{localStorage.bingo=JSON.stringify([...marked]);localStorage.bingoTab=cur}catch(e){}};
const count=s=>cards[s].flat().filter(v=>v&&marked.has(v)).length;
function render(){const c=cards[cur];let g='';
'BINGO'.split('').forEach((l,i)=>g+=`<div class="h" style="color:${col[i]}">${l}</div>`);
for(let r=0;r<5;r++)for(let k=0;k<5;k++){const v=c[k][r];
g+=v?`<div class="c${marked.has(v)?' on':''}" style="border-color:${col[k]}" data-v="${v}">${v}</div>`:`<div class="c free" style="border-color:${col[k]}">★</div>`}
const n=count(cur);
document.getElementById('card').innerHTML=`<div class="card"><h2><span>Serie ${cur}</span><span class="${n==24?'win':''}">${n==24?'¡BINGO! ':''}${n}/24</span></h2><div class="grid">${g}</div></div>`;
document.getElementById('tabs').innerHTML=Object.keys(cards).map(s=>`<button data-s="${s}" class="${s==cur?'act':''}">Cartón ${s}<b>${count(s)}/24</b></button>`).join('')}
document.getElementById('card').onclick=e=>{const v=+e.target.dataset.v;if(!v)return;marked.has(v)?marked.delete(v):marked.add(v);save();render()};
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;cur=b.dataset.s;save();render()};
function mark(){const i=document.getElementById('n'),v=+i.value;if(!v)return;marked.add(v);save();render();
const w=Object.keys(cards).filter(s=>cards[s].flat().includes(v));
document.getElementById('msg').textContent=w.length?`${v} ✔ en cartón ${w.join(', ')}`:`${v} no está en tus cartones`;i.value='';i.blur()}
document.getElementById('ok').onclick=mark;document.getElementById('n').onkeydown=e=>{if(e.key=='Enter')mark()};
document.getElementById('reset').onclick=()=>{if(confirm('¿Borrar todas las marcas?')){marked.clear();save();render();document.getElementById('msg').textContent=''}};
render();
</script></body></html>
