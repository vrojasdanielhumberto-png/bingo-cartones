<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis cartones de Bingo</title>
<style>
body{margin:0;background:#1c2233;color:#fff;font-family:system-ui,sans-serif;padding:12px}
h1{font-size:20px;margin:4px 0 10px;text-align:center}
.bar{display:flex;gap:8px;position:sticky;top:0;background:#1c2233;padding:8px 0;z-index:2}
.bar input{flex:1;font-size:22px;padding:10px;border-radius:10px;border:0;min-width:0}
.bar button{font-size:16px;padding:10px 14px;border-radius:10px;border:0;font-weight:700}
#ok{background:#4caf50;color:#fff}#reset{background:#e57373;color:#fff}
#msg{text-align:center;min-height:22px;font-weight:700;color:#ffd54f}
.card{background:#232b40;border-radius:14px;padding:10px;margin:14px 0}
.card h2{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.h{text-align:center;font-weight:900;font-size:22px}
.c{aspect-ratio:1;border-radius:50%;background:#fff;color:#222;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;border:5px solid;user-select:none;cursor:pointer}
.c.on{background:#ffd54f;transform:scale(.92);box-shadow:inset 0 0 0 4px #e65100}
.c.free{background:#ffd54f;font-size:14px}
.win{color:#4caf50}
</style></head><body>
<h1>BINGO · mis 3 cartones</h1>
<div class="bar"><input id="n" type="number" inputmode="numeric" placeholder="Número cantado"><button id="ok">Marcar</button><button id="reset">Borrar</button></div>
<div id="msg"></div>
<div id="cards"></div>
<p style="text-align:center;opacity:.6;font-size:13px">Toca un número para marcarlo o desmarcarlo. Se guarda en este celular.</p>
<script>
const cards={6489:[[11,5,4,6,14],[22,27,21,23,18],[43,38,0,32,45],[49,52,47,54,53],[62,69,63,68,70]],
6490:[[15,10,5,7,9],[20,22,17,28,27],[32,42,0,33,34],[46,51,56,53,60],[65,66,64,74,67]],
6495:[[5,4,2,10,3],[23,26,29,22,27],[37,42,0,43,44],[47,55,52,58,59],[64,67,70,65,69]]};
const col=['#f5c518','#4a7fd4','#3fae8a','#e8604c','#a98bd6'];
let marked=new Set();try{marked=new Set(JSON.parse(localStorage.bingo||'[]'))}catch(e){}
const save=()=>{try{localStorage.bingo=JSON.stringify([...marked])}catch(e){}};
function render(){let h='';for(const s in cards){const c=cards[s];let cnt=0,g='';
'BINGO'.split('').forEach((l,i)=>g+=`<div class="h" style="color:${col[i]}">${l}</div>`);
for(let r=0;r<5;r++)for(let k=0;k<5;k++){const v=c[k][r];if(!v){g+=`<div class="c free" style="border-color:${col[k]}">★</div>`;continue}
const on=marked.has(v);if(on)cnt++;g+=`<div class="c${on?' on':''}" style="border-color:${col[k]}" data-v="${v}">${v}</div>`}
const full=cnt==24;h+=`<div class="card"><h2><span>Serie ${s}</span><span class="${full?'win':''}">${full?'¡BINGO! ':''}${cnt}/24</span></h2><div class="grid">${g}</div></div>`}
document.getElementById('cards').innerHTML=h}
document.getElementById('cards').onclick=e=>{const v=+e.target.dataset.v;if(!v)return;marked.has(v)?marked.delete(v):marked.add(v);save();render()};
function mark(){const i=document.getElementById('n'),v=+i.value;if(!v)return;marked.add(v);save();render();
const w=Object.keys(cards).filter(s=>cards[s].flat().includes(v));
document.getElementById('msg').textContent=w.length?`${v} ✔ en serie ${w.join(', ')}`:`${v} no está en tus cartones`;i.value='';i.focus()}
document.getElementById('ok').onclick=mark;document.getElementById('n').onkeydown=e=>{if(e.key=='Enter')mark()};
document.getElementById('reset').onclick=()=>{if(confirm('¿Borrar todas las marcas?')){marked.clear();save();render();document.getElementById('msg').textContent=''}};
render();
</script></body></html>
